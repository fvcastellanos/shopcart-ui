# =============================================================================
# Docker Compose — frontend de ShopCart (solo shopcart-ui)
# =============================================================================
# Levanta únicamente el frontend. La API (shopcart-api) se asume corriendo por
# separado; por defecto se configura para alcanzarla en el host (tu máquina),
# donde `npm run dev` en shopcart-api publica http://localhost:4000.
# =============================================================================

name: shopcart-ui

services:
  ui:
    build:
      context: ..               # raíz de shopcart-ui (package.json + .dockerignore)
      dockerfile: docker/Dockerfile
    ports:
      - "9080:80"               # http://localhost:8080
    restart: unless-stopped
