server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta del cliente (react-router) sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API (mismo origen, prefijo /v1).
    # Ajusta "api:4000" al nombre/puerto del servicio shopcart-api en compose.
    location /v1/ {
        proxy_pass http://workshop-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets versionados: cache agresiva de estáticos.
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
